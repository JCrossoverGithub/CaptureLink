name: CaptureLink CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Signaling integration tests
        run: node --test services/signaling/test/signaling.test.mjs services/signaling/test/client.test.mjs services/signaling/test/desktop-bridge.test.mjs services/signaling/test/guest-name.test.mjs

      - name: UX3c-1 remote client security tests
        run: node --test services/signaling/test/remote-client.test.mjs

      - name: UX3c-1 main-process boundary smoke
        run: node scripts/ux3c1-remote-source-smoke.mjs

      - name: UX3c-2 pilot broker admission and abuse tests
        run: node --test services/signaling/test/pilot-server.test.mjs

      - name: UX3F-2 offline public authorization and v2 broker tests
        run: node --test services/signaling/test/public-authorization-policy.test.mjs services/signaling/test/public-v2-server.test.mjs

      - name: UX3F-2 protected v1/desktop source boundary
        run: node scripts/ux3f2-source-boundary.mjs

      - name: UX3F-3A provider-neutral Windows auth and secret vault tests
        run: node --test services/signaling/test/ux3f3-online-auth.test.mjs

      - name: UX3F-3A protected Xbox and hosted signaling boundary
        run: node scripts/ux3f3a-source-boundary.mjs

      - name: UX3F-3B1 offline Auth0 PKCE, JWKS and v2 client integration
        run: node --test services/signaling/test/ux3f3b-auth0-integration.test.mjs

      - name: UX3F-3B1 protected desktop and broker source boundary
        run: node scripts/ux3f3b1-source-boundary.mjs

      - name: UX3c-2 localhost/pilot boundary smoke
        run: node scripts/ux3c2-broker-source-smoke.mjs

      - name: UX3c-3b asynchronous cancellation and teardown tests
        run: node --test scripts/ux3c3b-session-cancellation.test.mjs

      - name: UX3c-3b signaling lifecycle boundary smoke
        run: node scripts/ux3c3b-session-lifecycle-source-smoke.mjs

      - name: UX3c-3d offline encrypted enrollment and rotation tests
        run: node --test services/signaling/test/ux3c3d-enrollment.test.mjs

      - name: UX3c-3d main-process and renderer boundary smoke
        run: node scripts/ux3c3d-enrollment-source-smoke.mjs

      - name: UX and voice regression tests
        shell: pwsh
        run: |
          $tests = @(
            'ux3b1-electron-source-smoke.mjs',
            'ux3b1-end-session-smoke.mjs',
            'ux3b1-local-guest-smoke.mjs',
            'ux3b1-guest-name-smoke.mjs',
            'ux3b1-recovery-smoke.mjs',
            'unified-session-ux1-smoke.mjs',
            'unified-session-ux1b-smoke.mjs',
            'unified-session-ux2-smoke.mjs',
            'shared-session-hub-smoke.mjs',
            'shared-voice-signaling-smoke.mjs',
            'shared-voice-ice-smoke.mjs',
            'shared-voice-host-flow-smoke.mjs',
            'shared-voice-audio-path-smoke.mjs',
            'shared-voice-guest-uplink-smoke.mjs'
          )
          foreach ($test in $tests) {
            node "scripts/$test"
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $test" }
          }

  private-pilot-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Local operator runtime and permissions tests
        run: node --test services/signaling/test/pilot-runtime.test.mjs
      - name: Local deployment boundary smoke
        run: node scripts/ux3c3a-deploy-source-smoke.mjs
      - name: UX3c-3c offline HTTPS edge integration
        run: node --test services/signaling/test/ux3c3c-https-edge.test.mjs
      - name: UX3c-3c no-public-exposure source boundary
        run: node scripts/ux3c3c-edge-source-smoke.mjs

      - name: UX3F-2 Linux offline v2 broker and source boundary
        run: |
          node --test services/signaling/test/public-authorization-policy.test.mjs services/signaling/test/public-v2-server.test.mjs
          node scripts/ux3f2-source-boundary.mjs

      - name: UX3F-3A provider-neutral auth and boundary on Linux
        run: |
          node --test services/signaling/test/ux3f3-online-auth.test.mjs
          node scripts/ux3f3a-source-boundary.mjs

      - name: UX3F-3B1 Auth0 offline adapter and protected source on Linux
        run: |
          node --test services/signaling/test/ux3f3b-auth0-integration.test.mjs
          node scripts/ux3f3b1-source-boundary.mjs
